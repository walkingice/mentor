<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末評語小幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f3f4f6;
        }
        @keyframes student-row-enter {
            from {
                opacity: 0;
                transform: translateY(-10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes student-row-remove {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
                max-height: 800px;
                margin-bottom: 0.5rem;
            }
            to {
                opacity: 0;
                transform: translateX(24px) scale(0.98);
                max-height: 0;
                margin-bottom: 0;
                overflow: hidden;
            }
        }

        .student-row-enter {
            animation: student-row-enter 500ms ease-out both;
        }

        .student-row-removing {
            animation: student-row-remove 500ms ease-in both;
            pointer-events: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .student-row-enter,
            .student-row-removing {
                animation-duration: 500ms;
            }
        }

        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const STORAGE_PREFIX_KEY = 'myapp_comment';
        const getStorageKey = key => `${STORAGE_PREFIX_KEY}:${key}`;
        const isAppStorageKey = key => key.startsWith(`${STORAGE_PREFIX_KEY}:`);
        const getLogicalStorageKey = key => key.slice(`${STORAGE_PREFIX_KEY}:`.length);
        const getAppStorageKeys = storage => Object.keys(storage).filter(isAppStorageKey);
        const clearAppStorage = storage => getAppStorageKeys(storage).forEach(key => storage.removeItem(key));
        const restoreLocalStorageBackup = (backup, storage) => Object.entries(backup).forEach(([key, value]) => (
            storage.setItem(getStorageKey(key), value)
        ));

        const DEFAULT_PRESET_TRAITS = {
            positive: ["好學不倦", "勤學專注", "課業認真", "富有愛心", "誠實坦白", "語言能力佳", "具有領導力", "抗壓性高", "積極樂觀", "善於溝通", "言行端正", "合群助人", "服務熱心", "做事勤快", "藝術表現佳", "數理表現佳", "語文表現佳", "課業總體優秀", "循規蹈矩", "富正義感", "忠實文靜", "性情溫和", "志向高超", "意志堅強", "沈靜忠厚", "尊敬師友"],
            neutral: ["嚴謹務實", "反應迅速", "自我要求高", "平易近人", "律己嚴謹", "富領悟力", "富想像力", "創造力強", "字體有進步", "人緣好", "洞察力敏銳", "能獨立思考", "理智冷靜", "穩定安靜", "精力旺盛", "性情率真", "隨遇而安"],
            negative: ["語文較差", "字體欠端正", "偶爾糊塗", "行事馬虎", "粗心大意", "略為膽怯", "個性強硬", "不善溝通合作", "不善表達", "自我強烈", "略有驕傲", "略少同理心", "不易遵守規則", "心思不定", "無法持恆", "作業常遲交", "注意力不集中", "意志薄弱", "身體虛弱", "心浮氣躁", "患得患失", "情緒不穩", "意氣用事"]
        };

        const DEFAULT_SETTINGS = {
            className: "1年1班",
            tone: "溫暖",
            commentLength: 30,
            includeName: true,
            includeClosing: true,
            apiKey: "",
            model: "gemini-3.1-flash-lite"
        };

        const DEFAULT_GEMINI_MODELS = [
            "gemini-3.1-flash-lite",
            "gemini-3.5-flash"
        ];

        const createStudent = () => ({
            id: crypto.randomUUID(),
            name: "",
            traits: [],
            comment: "",
            isLoading: false,
            error: null
        });

        // Initialize default 20 students
        const INITIAL_STUDENTS = Array.from({ length: 20 }, createStudent);

        const parseRosterNames = (text) => text.trim().split(/[\s,，]+/).filter(Boolean);
        const canUseCommentActions = comment => Boolean(comment?.trim());
        const getStudentRowAnimationClass = isRemoving => (
            isRemoving ? 'student-row-removing' : 'student-row-enter'
        );

        const getExportTimestamp = now => {
            const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;
            return `${dateStr}_${timeStr}`;
        };

        const getExportFilename = (className, label, extension) => (
            `${className}${label}_${getExportTimestamp(new Date())}.${extension}`
        );

        const removeApiKeyFromSettings = settingsValue => {
            try {
                const settings = JSON.parse(settingsValue);
                if (!settings || Array.isArray(settings) || typeof settings !== 'object') return settingsValue;
                const { apiKey, ...safeSettings } = settings;
                return JSON.stringify(safeSettings);
            } catch (error) {
                return settingsValue;
            }
        };

        const createLocalStorageBackup = storage => {
            const backup = Object.fromEntries(
                getAppStorageKeys(storage)
                    .map(key => [getLogicalStorageKey(key), storage.getItem(key)])
            );
            if (backup['teacher-settings']) {
                backup['teacher-settings'] = removeApiKeyFromSettings(backup['teacher-settings']);
            }
            return backup;
        };

        const parseLocalStorageBackup = text => {
            const backup = JSON.parse(text);
            if (!backup || Array.isArray(backup) || typeof backup !== 'object') {
                throw new Error('備份檔格式不正確。');
            }
            if (Object.entries(backup).some(([key, value]) => typeof key !== 'string' || typeof value !== 'string')) {
                throw new Error('備份檔內容不正確。');
            }
            return backup;
        };

        const preserveCurrentApiKey = (backup, storage) => {
            const importedSettings = JSON.parse(backup['teacher-settings'] || 'null');
            const currentSettings = JSON.parse(storage.getItem(getStorageKey('teacher-settings')) || 'null');
            if (!importedSettings || Array.isArray(importedSettings) || typeof importedSettings !== 'object') return backup;

            if (typeof currentSettings?.apiKey === 'string') {
                importedSettings.apiKey = currentSettings.apiKey;
            } else {
                delete importedSettings.apiKey;
            }
            return { ...backup, 'teacher-settings': JSON.stringify(importedSettings) };
        };

        const { useState, useEffect, useCallback, useRef } = React;

        // Helper to determine tag colors dynamically based on category
        const getTagColorClass = (tag, presetTraits) => {
            if (presetTraits?.positive?.includes(tag)) {
                return {
                    bg: "bg-emerald-50 text-emerald-700 border-emerald-200",
                    button: "text-emerald-500 hover:text-emerald-700 hover:bg-emerald-100"
                };
            }
            if (presetTraits?.negative?.includes(tag)) {
                return {
                    bg: "bg-rose-50 text-rose-700 border-rose-200",
                    button: "text-rose-500 hover:text-rose-700 hover:bg-rose-100"
                };
            }
            if (presetTraits?.neutral?.includes(tag)) {
                return {
                    bg: "bg-slate-50 text-slate-700 border-slate-200",
                    button: "text-slate-500 hover:text-slate-700 hover:bg-slate-100"
                };
            }
            // Custom tag that has been chosen but doesn't exist in preset categories
            return {
                bg: "bg-sky-50 text-sky-700 border-sky-200",
                button: "text-sky-500 hover:text-sky-700 hover:bg-sky-100"
            };
        };

        // Custom hook for localStorage
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                if (typeof window === "undefined") return initialValue;
                try {
                    const item = window.localStorage.getItem(getStorageKey(key));
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = value => {
                try {
                    setStoredValue(previousValue => {
                        const valueToStore = value instanceof Function
                            ? value(previousValue)
                            : value;
                        if (typeof window !== "undefined") {
                            window.localStorage.setItem(getStorageKey(key), JSON.stringify(valueToStore));
                        }
                        return valueToStore;
                    });
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        }

                    return (

                    );
                case "plus-circle":
                    return (
                        <svg {...svgProps}>
                            <circle cx="12" cy="12" r="10" />

                            <line x1="8" x2="16" y1="12" y2="12" />

                    );
                case "plus":
                    return (

                            <line x1="5" x2="19" y1="12" y2="12" />

                    );
                case "x":
                    return (

                            <line x1="18" x2="6" y1="6" y2="18" />
                            <line x1="6" x2="18" y1="6" y2="18" />
                        </svg>
                    );
                case "check":
                    return (

                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    );
                case "rotate-ccw":
                    return (

                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />

                        </svg>
                    );
                case "tags":
                    return (
                        <svg {...svgProps}>
                            <path d="M12 2H2v10l9.29 9.29c.39.39 1.02.39 1.41 0l8.59-8.59c.39-.39.39-1.02 0-1.41L12 2z" />
                            <path d="M5 5h.01" />
                        </svg>
                    );
                case "key":
                    return (
                        <svg {...svgProps}>
                            <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 1.5 1.5M15.5 7.5 14 6" />
                        </svg>
                    );
                case "eye":
                    return (
                        <svg {...svgProps}>
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    );
                case "eye-off":
                    return (
                        <svg {...svgProps}>
                            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                            <line x1="2" x2="22" y1="2" y2="22" />
                        </svg>
                    );
                case "external-link":
                    return (
                        <svg {...svgProps}>
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                            <polyline points="15 3 21 3 21 9" />
                            <line x1="10" x2="21" y1="14" y2="3" />
                        </svg>
                    );
                case "copy":
                    return (
                        <svg {...svgProps}>
                            <rect x="9" y="9" width="11" height="11" rx="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                    );
                case "eraser":
                    return (
                        <svg {...svgProps}>
                            <path d="m7 21 10-10" />

                            <path d="m14 5 2-2a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3l-2 2" />
                        </svg>
                    );
                default:
                    return null;
            }
        };

        const getModelId = modelName => modelName.replace(/^models\//, '');

        const isStableTextModel = model => {
            const modelId = getModelId(model.name || '');
            return DEFAULT_GEMINI_MODELS.includes(modelId)
                && (model.supportedGenerationMethods || []).includes('generateContent');
        };

        const fetchAvailableGeminiModels = async apiKey => {
            const response = await fetch(
                'https://generativelanguage.googleapis.com/v1beta/models',
                { headers: { 'x-goog-api-key': apiKey } }
            );
            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                const errorMessage = result?.error?.message;
                throw new Error(errorMessage || `模型清單請求失敗，狀態碼: ${response.status}`);
            }

            return (result.models || [])
                .filter(isStableTextModel)
                .map(model => getModelId(model.name))
                .filter(Boolean)
                .sort((first, second) => (
                    DEFAULT_GEMINI_MODELS.indexOf(first) - DEFAULT_GEMINI_MODELS.indexOf(second)
                ));
        };

        const buildCommentPrompt = (student, settings) => {
            const toneMap = {
                "溫暖": "溫暖、充滿鼓勵與關懷",
                "理性": "客觀、理性、具體點出事實",
                "嚴厲": "較為嚴肅，指出缺點並給與明確的改進方向，但不過度打擊"
            };
            const configuredCommentLength = Number(settings.commentLength);
            const commentLength = configuredCommentLength > 0
                ? configuredCommentLength
                : DEFAULT_SETTINGS.commentLength;
            const lengthDescription = `約 ${commentLength} 字`;
            const shouldIncludeName = settings.includeName !== false && student.name?.trim();
            const studentReference = shouldIncludeName ? student.name.trim() : '該生';
            const openingReference = shouldIncludeName ? student.name.trim() : '你';

            let prompt = `你是一位台灣國中小學教師，正在撰寫學生的期末評語。
請根據以下資訊撰寫評語：
- 學生姓名：${studentReference}
- 特質標籤：${student.traits.join('、 ') || '無特別標註'}
- 期望口吻：${toneMap[settings.tone] || settings.tone}
- 是否包含勉勵結語：${settings.includeClosing ? '是，請在最後加一些勉勵的話' : '否，不需要勉勵結語'}

強制指示：
1. 產生的評語必須現代、口語化，像是對家長或學生說話的感覺。
2. 開頭請盡量使用類似「老師覺得 ${shouldIncludeName ? student.name.trim() : '你'} 是..」、「${openingReference} 是個....」、「${openingReference} 一直以來....」的方式。
3. 如果有提供特質標籤，請務必將這些特質自然地揉合進評語的句子中，不要只是條列。
4. 絕對不要輸出任何引言（例如「這是一段評語：」）、問候語或解釋，直接輸出評語內容本身即可。
`;

            if (student.comment && student.comment.trim() !== '') {
                prompt += `\n\n這是我目前寫好的草稿：\n「${student.comment}」\n\n請以這段草稿為基底，結合上述的「特質標籤」與「設定」重新潤飾、擴寫，讓句子更通順完整，字數${lengthDescription}。`;
            } else {
                prompt += `\n\n請直接根據上述設定產生一段${lengthDescription}的完整期末評語。`;
            }

            return prompt;
        };

        const generateCommentWithGemini = async (student, settings, prompt) => {
            const apiKey = settings.apiKey?.trim();
            if (!apiKey) {
                throw new Error("請先在最上方貼上您的 Gemini API 金鑰！");
            }

            const model = DEFAULT_GEMINI_MODELS.includes(settings.model)
                ? settings.model
                : DEFAULT_GEMINI_MODELS[0];
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
            const requestPrompt = prompt ?? buildCommentPrompt(student, settings);
            const payload = {
                contents: [{ parts: [{ text: requestPrompt }] }],
                generationConfig: {
                    temperature: 0.7,
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify(payload)
                });
                
                if (response.status === 400 || response.status === 403) {
                    const errorDetails = await response.json().catch(() => ({}));
                    const errMsg = errorDetails?.error?.message || "";
                    if (errMsg.toLowerCase().includes("api key")) {
                        throw new Error("金鑰無效或不正確，請重新檢查您的 API 金鑰。");
                    }
                }
                
                if (!response.ok) {
                    const errorDetails = await response.json().catch(() => ({}));
                    const errorMessage = errorDetails?.error?.message;
                    throw new Error(
                        errorMessage
                            ? `API 請求失敗（${response.status}）：${errorMessage}`
                            : `API 請求失敗，狀態碼: ${response.status}`
                    );
                }
                
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0) {
                    let text = result.candidates[0].content.parts[0].text;
                    // Clean up potential markdown or quotes
                    return text.replace(/^["'「]|["'」]$/g, '').trim(); 
                } else {
                    throw new Error("模型未回傳內容，可能被過濾安全機制擋下。");
                }
            } catch (error) {
                console.error("Generation Error:", error);
                throw error;
            }
        };

        const PromptPreviewDialog = ({ prompt, onClose, onConfirm }) => {
            if (!prompt) return null;

            return (
                <div

                        setError('檔案中沒有可匯入的學生姓名。');

                                    <button

        const TagInput = ({ tags, onChange, onOpenModal, presetTraits }) => {
            const [inputValue, setInputValue] = useState('');

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' || e.key === 'Tab' || e.key === ' ') {
                    e.preventDefault();
                    const trimmed = inputValue.trim();
                    if (trimmed && !tags.includes(trimmed)) {
                        onChange([...tags, trimmed]);
                    }
                    setInputValue('');
                } else if (e.key === 'Backspace' && !inputValue && tags.length > 0) {
                    onChange(tags.slice(0, -1));
                }
            };

            const removeTag = (indexToRemove) => {
                onChange(tags.filter((_, index) => index !== indexToRemove));
            };

            return (
                <div 
                    onClick={(e) => {
                        // Click background opens modal
                        if (e.target === e.currentTarget) {
                            onOpenModal();
                        }
                    }}
                    className="flex flex-wrap items-center gap-2 p-2 min-h-[44px] border border-gray-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition-all cursor-pointer hover:border-blue-300"
                    title="點選空白處或右側圓形 + 鈕叫出特質選單"
                >
                    {tags.map((tag, index) => {
                        const colors = getTagColorClass(tag, presetTraits);
                        return (
                            <span 
                                key={index} 
                                className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-sm font-medium border transition-all ${colors.bg}`}

                                    type="button" 
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        removeTag(index);
                                    }}
                                    className={`rounded-full p-0.5 transition-colors inline-flex items-center justify-center ${colors.button}`}
                                    title="刪除標籤"
                                >
                                    <svg className="w-3 h-3 stroke-current" fill="none" viewBox="0 0 24 24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </span>
                        );
                    })}
                    <div className="flex-1 min-w-[120px] flex items-center gap-2">

        const InsertionDivider = ({ onInsert }) => {
            return (
                <div className="relative flex items-center justify-center py-2 group/divider">
                    <div className="absolute inset-0 flex items-center" aria-hidden="true">
                        <div className="w-full border-t border-dashed border-sky-300 group-hover/divider:border-sky-500 transition-colors"></div>
                    </div>
                    <button
                        type="button"
                        onClick={onInsert}
                        className="relative z-10 flex h-8 w-8 items-center justify-center rounded-full border border-sky-200 bg-sky-50 text-sky-600 shadow-md hover:bg-sky-600 hover:text-white hover:border-transparent focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all transform scale-100 group-hover/divider:scale-110 hover:shadow-lg cursor-pointer"
                        title="在此處插入新學生"
                    >
                        <svg className="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" strokeWidth="3">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                    </button>
                </div>
            );
        };

        const App = () => {
            const [settings, setSettings] = useLocalStorage('teacher-settings', DEFAULT_SETTINGS);
            const [students, setStudents] = useLocalStorage('teacher-students', INITIAL_STUDENTS);
            const [presetTraits, setPresetTraits] = useLocalStorage('teacher-preset-traits', DEFAULT_PRESET_TRAITS);
            
            const [modalConfig, setModalConfig] = useState({ isOpen: false, studentId: null });
            const [isRosterImportOpen, setIsRosterImportOpen] = useState(false);
            const [promptPreview, setPromptPreview] = useState(null);
            const [globalError, setGlobalError] = useState(null);
            const [deletingId, setDeletingId] = useState(null);
            const [copiedId, setCopiedId] = useState(null);
            const [showApiKey, setShowApiKey] = useState(false);
            const [availableModels, setAvailableModels] = useState(DEFAULT_GEMINI_MODELS);
            const [modelError, setModelError] = useState(null);
            const [isLoadingModels, setIsLoadingModels] = useState(false);
            const [removingId, setRemovingId] = useState(null);
            const backupFileInputRef = useRef(null);

            const refreshAvailableModels = async () => {
                const apiKey = settings.apiKey?.trim();
                if (!apiKey) {
                    setAvailableModels(DEFAULT_GEMINI_MODELS);
                    setModelError(null);
                    return;
                }

                setIsLoadingModels(true);
                setModelError(null);
                try {
                    const models = await fetchAvailableGeminiModels(apiKey);
                    if (models.length === 0) {
                        throw new Error("此 API 金鑰沒有可用的 generateContent model。");
                    }

                    setAvailableModels(models);
                    if (!models.includes(settings.model)) {
                        setSettings({ ...settings, model: models[0] });
                    }
                } catch (error) {
                    console.error("Model Discovery Error:", error);
                    setAvailableModels(DEFAULT_GEMINI_MODELS);
                    if (!DEFAULT_GEMINI_MODELS.includes(settings.model)) {
                        setSettings({ ...settings, model: DEFAULT_GEMINI_MODELS[0] });
                    }
                    setModelError(error.message);
                } finally {
                    setIsLoadingModels(false);
                }
            };

            const updateStudent = (id, field, value) => {
                setStudents(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
            };

            const importRoster = (names) => {
                setStudents(names.map(name => ({
                    id: crypto.randomUUID(),
                    name,
                    traits: [],
                    comment: "",
                    isLoading: false,
                    error: null
                })));
            };

            const handleGenerateComment = async (studentId, promptOverride = null) => {
                setGlobalError(null);
                updateStudent(studentId, 'isLoading', true);
                updateStudent(studentId, 'error', null);
                
                const student = students.find(s => s.id === studentId);
                
                try {
                    const generatedText = await generateCommentWithGemini(student, settings, promptOverride);
                    updateStudent(studentId, 'comment', generatedText);
                } catch (error) {
                    updateStudent(studentId, 'error', error.message);
                    // Leave the error visible slightly longer so they can notice API Key alerts
                    setTimeout(() => updateStudent(studentId, 'error', null), 12000);
                } finally {
                    updateStudent(studentId, 'isLoading', false);
                }
            };

            const handlePreviewPrompt = (studentId) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;

                setPromptPreview({
                    studentId,
                    prompt: buildCommentPrompt(student, settings)
                });
            };

            const handleConfirmPrompt = () => {
                if (!promptPreview) return;

                const { studentId } = promptPreview;
                setPromptPreview(null);
                handleGenerateComment(studentId, promptPreview.prompt);
            };

            const addStudent = () => {
                setStudents(prev => [...prev, createStudent()]);
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
            };

            const insertStudentAt = (index) => {
                const newStudent = createStudent();
                setStudents(prev => {
                    const updated = [...prev];
                    updated.splice(index, 0, newStudent);
                    return updated;
                });
            };

            const removeStudent = (id) => {
                setRemovingId(id);
                setDeletingId(null);
                setTimeout(() => {
                    setStudents(prev => prev.filter(s => s.id !== id));
                    setRemovingId(currentId => currentId === id ? null : currentId);
                }, 500);
            };

            const clearStudentComment = (id) => {
                updateStudent(id, 'comment', '');
            };

            const copyStudentComment = async (student) => {
                if (!canUseCommentActions(student.comment) || !navigator.clipboard) return;

                try {
                    await navigator.clipboard.writeText(student.comment);
                    setCopiedId(student.id);
                    setTimeout(() => setCopiedId(currentId => currentId === student.id ? null : currentId), 1500);
                } catch (error) {
                    console.error('Copy Comment Error:', error);
                }
            };

            const handleExport = () => {
                if (students.length === 0) return;
                
                let content = `${settings.className} 期末評語\n`;
                content += `匯出時間：${new Date().toLocaleString('zh-TW')}\n`;
                content += `=====================================\n\n`;

                students.forEach(s => {
                    content += `【${s.name}】\n`;
                    content += `特質：${s.traits.join(', ') || '無'}\n`;
                    content += `評語：\n${s.comment || '(尚未填寫)'}\n\n`;
                    content += `-------------------------------------\n\n`;
                });

                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                
                link.href = url;
                link.download = getExportFilename(settings.className, '評語', 'txt');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const handleExportBackup = () => {
                const backup = createLocalStorageBackup(window.localStorage);
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = getExportFilename(settings.className, '備份', 'json');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const handleImportBackup = async event => {
                const file = event.target.files?.[0];
                event.target.value = '';
                if (!file) return;

                try {
                    const backup = preserveCurrentApiKey(
                        parseLocalStorageBackup(await file.text()),
                        window.localStorage
                    );
                    if (!window.confirm('匯入備份會覆蓋目前所有資料，確定要繼續嗎？')) return;
                    clearAppStorage(window.localStorage);
                    restoreLocalStorageBackup(backup, window.localStorage);
                    window.location.reload();
                } catch (error) {
                    console.error('Backup Import Error:', error);
                    setGlobalError(error instanceof SyntaxError ? '備份檔不是有效的 JSON 檔案。' : error.message);
                }
            };

            const openModalForStudent = (studentId) => {
                setModalConfig({ isOpen: true, studentId });
            };

            const handleAddTraitsFromModal = (selectedTraits) => {
                if (modalConfig.studentId && selectedTraits.length > 0) {
                    const student = students.find(s => s.id === modalConfig.studentId);
                    const newTraits = [...new Set([...student.traits, ...selectedTraits])];
                    updateStudent(modalConfig.studentId, 'traits', newTraits);
                }
            };

            return (
                <div className="min-h-screen pb-28">
                    {/* Header & Settings */}
                    <header className="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8">
                            <div className="flex flex-col gap-3">
                                <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                                    <h1 className="text-2xl font-bold text-gray-900 tracking-tight">期末評語小幫手</h1>

                                    <div className="flex flex-col sm:flex-row sm:items-center gap-3 lg:justify-end">
                                    {/* Responsive Secure Gemini API Key Setting with Direct Sign up Portal Link */}
                                    <div className="flex items-center gap-2 bg-blue-50/75 hover:bg-blue-50 border border-blue-100 rounded-xl px-3 py-2 transition-colors lg:min-w-[28rem]">
                                        <Icon name="key" size={16} className="text-blue-500 shrink-0" />
                                        <input
                                            type={showApiKey ? "text" : "password"}
                                            value={settings.apiKey || ""}
                                            onChange={e => setSettings({...settings, apiKey: e.target.value})}
                                            placeholder="請貼上 Gemini API 金鑰"
                                            className="bg-transparent text-sm font-medium text-gray-700 outline-none w-44 placeholder-blue-300 border-none focus:ring-0 p-0"
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => setShowApiKey(!showApiKey)}
                                            className="text-blue-400 hover:text-blue-600 transition-colors inline-flex items-center"
                                            title={showApiKey ? "隱藏金鑰" : "顯示金鑰"}
                                        >
                                            <Icon name={showApiKey ? "eye-off" : "eye"} size={16} />
                                        </button>
                                        <a 
                                            href="https://aistudio.google.com/" 
                                            target="_blank" 
                                            rel="noopener noreferrer" 
                                            className="text-xs text-blue-600 hover:underline hover:text-blue-800 flex items-center gap-0.5 ml-1.5 border-l border-blue-200 pl-2 shrink-0 font-medium"
                                            title="前往 Google AI Studio 免費申請您的專屬金鑰 (使用 Google 帳號)"
                                        >
                                            <span>申請金鑰</span>
                                            <Icon name="external-link" size={12} />
                                        </a>
                                        <a
                                            id="howto-api-key"
                                            href="https://www.google.com/search?q=%E5%A6%82%E4%BD%95%E7%94%B3%E8%AB%8B+Gemini+API+Key"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="text-xs text-blue-600 hover:underline hover:text-blue-800 ml-1.5 border-l border-blue-200 pl-2 shrink-0 font-medium"
                                            title="搜尋如何申請 Gemini API Key"
                                            aria-label="搜尋如何申請 Gemini API Key"
                                        >
                                        如何申請？
                                        </a>
                                    </div>
                                    <div className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 shrink-0">
                                        <label htmlFor="gemini-model" className="text-xs font-semibold text-gray-500 whitespace-nowrap">
                                            Model
                                        </label>
                                        <select
                                            id="gemini-model"
                                            value={settings.model || availableModels[0]}
                                            onChange={e => setSettings({ ...settings, model: e.target.value })}
                                            disabled={isLoadingModels}
                                            className="max-w-[220px] bg-transparent text-sm font-medium text-gray-700 outline-none cursor-pointer disabled:cursor-wait"
                                        >
                                            {availableModels.map(model => (
                                                <option key={model} value={model}>{model}</option>
                                            ))}
                                        </select>
                                        <button
                                            type="button"
                                            onClick={refreshAvailableModels}
                                            disabled={!settings.apiKey?.trim() || isLoadingModels}
                                            className="inline-flex items-center justify-center rounded-md p-1 text-gray-400 hover:bg-gray-200 hover:text-gray-700 disabled:cursor-not-allowed disabled:opacity-40"
                                            title="重新整理 Model 清單"
                                            aria-label="重新整理 Model 清單"
                                        >
                                            <Icon name={isLoadingModels ? "loader-2" : "rotate-ccw"} size={14} />
                                        </button>
                                    </div>
                                    </div>
                                </div>

                                {modelError && (
                                    <p className="text-xs text-amber-700 px-2 -mt-2">
                                        無法更新 Model 清單，暫使用預設清單：{modelError}
                                    </p>
                                )}

                                <div className="flex flex-wrap items-center gap-3 bg-gray-50 p-2 rounded-xl border border-gray-200 shadow-sm">
                                    <div className="flex items-center gap-2 px-2">
                                        <Icon name="users" size={16} className="text-gray-500" />
                                        <input 
                                            type="text" 
                                            value={settings.className}
                                            onChange={e => setSettings({...settings, className: e.target.value})}
                                            className="w-24 bg-transparent font-semibold text-gray-700 border-b-2 border-transparent focus:border-blue-500 outline-none transition-colors"
                                            placeholder="班級名稱"
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setIsRosterImportOpen(true)}
                                            className="shrink-0 px-2.5 py-1.5 text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 transition-colors"
                                        >
                                            匯入名冊
                                        </button>
                                    </div>
                                    <div className="h-6 w-px bg-gray-300"></div>
                                    <div className="flex items-center gap-2 px-2">
                                        <Icon name="mic" size={16} className="text-gray-500" />
                                        <select 
                                            value={settings.tone}
                                            onChange={e => setSettings({...settings, tone: e.target.value})}
                                            className="bg-transparent font-medium text-gray-700 outline-none cursor-pointer"
                                        >
                                            <option value="溫暖">溫暖鼓勵</option>
                                            <option value="理性">理性客觀</option>
                                            <option value="嚴厲">嚴厲鞭策</option>
                                        </select>
                                    </div>
                                    <div className="h-6 w-px bg-gray-300"></div>
                                    <div className="flex items-center gap-2 px-2">
                                        <label htmlFor="comment-length" className="text-sm font-medium text-gray-600 whitespace-nowrap">
                                            字數
                                        </label>
                                        <input
                                            id="comment-length"
                                            type="number"
                                            min="1"
                                            step="1"
                                            value={settings.commentLength ?? DEFAULT_SETTINGS.commentLength}
                                            onChange={e => setSettings({...settings, commentLength: e.target.value})}
                                            className="w-16 bg-transparent font-medium text-gray-700 outline-none"
                                            aria-label="評語字數"
                                        />
                                        <span className="text-sm font-medium text-gray-600">字</span>
                                    </div>
                                    <div className="h-6 w-px bg-gray-300"></div>
                                    <label className="flex items-center gap-2 px-2 cursor-pointer group">
                                        <input 
                                            type="checkbox" 
                                            checked={settings.includeName}
                                            onChange={e => setSettings({...settings, includeName: e.target.checked})}
                                            className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300 cursor-pointer"
                                        />
                                        <span className="text-sm font-medium text-gray-600 group-hover:text-gray-900 transition-colors">帶入姓名</span>
                                    </label>
                                    <label className="flex items-center gap-2 px-2 cursor-pointer group">
                                        <input 
                                            type="checkbox" 
                                            checked={settings.includeClosing}
                                            onChange={e => setSettings({...settings, includeClosing: e.target.checked})}
                                            className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300 cursor-pointer"
                                        />
                                        <span className="text-sm font-medium text-gray-600 group-hover:text-gray-900 transition-colors">勉勵結語</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content: Student List */}
                    <main className="max-w-5xl mx-auto px-4 py-6 sm:px-6 lg:px-8 space-y-2">
                        {globalError && (
                            <div className="bg-red-50 text-red-600 p-4 rounded-xl flex items-start gap-3 border border-red-100 mb-4 animate-bounce">
                                <Icon name="alert-circle" className="shrink-0 mt-0.5" />
                                <div>
                                    <h4 className="font-semibold">系統錯誤</h4>
                                    <p className="text-sm mt-1">{globalError}</p>
                                </div>
                            </div>
                        )}

                        {/* First Insertion Line */}
                        {students.length > 0 && (
                            <InsertionDivider onInsert={() => insertStudentAt(0)} />
                        )}

                        {/* Student Cards Loop */}
                        {students.map((student, index) => (
                            <React.Fragment key={student.id}>
                                <div className={`bg-white rounded-2xl shadow-sm border border-gray-200 overflow-visible hover:shadow-md transition-shadow group relative ${getStudentRowAnimationClass(removingId === student.id)}`}>
                                    
                                    {/* Action Buttons */}
                                    <div className="absolute left-0 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
                                        {deletingId === student.id ? (
                                            <div className="flex items-center gap-1.5 bg-red-50 border border-red-200 p-1 rounded-lg shadow-sm">
                                                <span className="text-xs text-red-700 font-medium px-1">確定刪除？</span>
                                                <button
                                                    onClick={() => removeStudent(student.id)}
                                                    className="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded font-semibold transition-colors"
                                                >
                                                    確認
                                                </button>
                                                <button
                                                    onClick={() => setDeletingId(null)}
                                                    className="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded font-semibold transition-colors"
                                                >
                                                    取消
                                                </button>
                                            </div>
                                        ) : (
                                            <button 
                                                onClick={() => setDeletingId(student.id)}
                                                className="text-gray-400 hover:text-red-500 p-1.5 rounded-lg hover:bg-red-50 transition-colors bg-white border border-gray-100 hover:border-red-200 shadow-sm"
                                                title="刪除本列"
                                                aria-label="刪除本列"
                                            >
                                                <Icon name="trash-2" size={18} />
                                            </button>
                                        )}
                                    </div>

                                    {/* Responsive card layout utilizing items-stretch to balance left and right panel spacing */}
                                    <div className="p-5 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                                        
                                        {/* Left Column: Meta & Actions */}
                                        <div className="lg:col-span-5 space-y-4 flex flex-col justify-between">
                                            <div className="space-y-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="flex items-center justify-center w-8 h-8 rounded-full bg-blue-50 text-blue-600 border border-blue-100 font-bold text-sm">
                                                        {index + 1}
                                                    </div>
                                                    <div className="flex-1 pr-8"> 
                                                        <input
                                                            type="text"
                                                            value={student.name}
                                                            onChange={(e) => updateStudent(student.id, 'name', e.target.value)}
                                                            placeholder="學生姓名或座號"
                                                            className="w-full text-lg font-bold text-gray-800 border-b border-dashed border-gray-300 focus:border-blue-500 pb-1 outline-none transition-colors bg-transparent"
                                                        />
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
                                                        特質標籤
                                                    </label>
                                                    <TagInput 
                                                        tags={student.traits} 
                                                        onChange={(newTags) => updateStudent(student.id, 'traits', newTags)} 
                                                        onOpenModal={() => openModalForStudent(student.id)}
                                                        presetTraits={presetTraits}
                                                    />
                                                </div>
                                            </div>
                                            
                                            <div className="pt-2">
                                                <div className="flex items-center gap-2">
                                                    <button
                                                        type="button"
                                                        onClick={() => handleGenerateComment(student.id)}
                                                        disabled={student.isLoading}
                                                        className={`flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-semibold transition-all ${
                                                            student.isLoading
                                                            ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                                                            : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:from-blue-700 hover:to-indigo-700 shadow-md hover:shadow-lg shadow-blue-500/30'
                                                        }`}
                                                    >
                                                        {student.isLoading ? (
                                                            <Icon name="loader-2" className="animate-spin" />
                                                        ) : (
                                                            <Icon name="wand-2" />
                                                        )}
                                                        {student.isLoading ? '撰寫中...' : (student.comment ? '潤飾 / 擴寫' : '產生評語')}
                                                    </button>

                                                    <button
                                                        type="button"
                                                        onClick={() => handlePreviewPrompt(student.id)}
                                                        disabled={student.isLoading}
                                                        className="shrink-0 px-3 py-2 text-xs font-medium text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                                    >
                                                        先檢視
                                                    </button>
                                                </div>

                                                {student.error && (
                                                    <p className="text-xs text-red-500 text-center flex items-center justify-center gap-1 mt-2 font-medium bg-red-50 py-1.5 px-2.5 rounded-lg border border-red-100">
                                                        <Icon name="alert-triangle" size={12} className="shrink-0" />
                                                        <span>{student.error}</span>
                                                    </p>
                                                )}
                                            </div>
                                        </div>

                                        {/* Right Column: Textarea with balanced padding and proper wide-screen spacing */}
                                        <div className="lg:col-span-7 flex flex-col h-full min-h-[180px] lg:min-h-[220px]">
                                            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">評語內容</label>
                                            <div className="flex-1 w-full h-full relative">
                                                <textarea
                                                    value={student.comment}
                                                    onChange={(e) => updateStudent(student.id, 'comment', e.target.value)}
                                                    placeholder="可留空讓 AI 完全自動產生，或在此輸入您的草稿，點選按鈕讓 AI 潤飾、擴寫、修飾語氣。"
                                                    className="absolute inset-0 w-full h-full p-4 pb-14 pr-28 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all outline-none resize-none text-gray-700 leading-relaxed overflow-y-auto"
                                                />
                                                <div className="absolute bottom-3 right-3 flex items-center gap-1">
                                                    <button
                                                        type="button"
                                                        onClick={() => clearStudentComment(student.id)}
                                                        disabled={!canUseCommentActions(student.comment)}
                                                        className="inline-flex items-center gap-1 rounded-lg border border-gray-200 bg-white px-2 py-1.5 text-xs font-medium text-gray-600 shadow-sm transition-colors hover:bg-gray-50 hover:text-red-600 disabled:cursor-not-allowed disabled:opacity-40"
                                                        title="清除評語"
                                                        aria-label="清除評語"
                                                    >
                                                        <Icon name="eraser" size={15} />
                                                        清除
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => copyStudentComment(student)}
                                                        disabled={!canUseCommentActions(student.comment)}
                                                        className="inline-flex items-center gap-1 rounded-lg border border-gray-200 bg-white px-2 py-1.5 text-xs font-medium text-gray-600 shadow-sm transition-colors hover:bg-gray-50 hover:text-blue-600 disabled:cursor-not-allowed disabled:opacity-40"
                                                        title="複製評語"
                                                        aria-label="複製評語"
                                                    >
                                                        <Icon name={copiedId === student.id ? 'check' : 'copy'} size={15} />
                                                        {copiedId === student.id ? '已複製' : '複製'}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Insertion Line after each student */}
                                <InsertionDivider onInsert={() => insertStudentAt(index + 1)} />
                            </React.Fragment>
                        ))}

                        {/* Add student button at the bottom */}
                        <button 
                            onClick={addStudent}
                            className="w-full py-4 border-2 border-dashed border-gray-300 rounded-2xl text-gray-500 font-medium hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50 transition-all flex justify-center items-center gap-2 shadow-sm"
                        >
                            <Icon name="plus-circle" />
                            新增一位學生至最尾端
                        </button>
                    </main>

                    {/* Fixed Bottom Bar for Export and Status */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 p-4">
                        <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <span className="bg-blue-50 text-blue-700 text-sm font-bold px-3.5 py-1.5 rounded-full border border-blue-200 shadow-sm flex items-center gap-2">
                                <Icon name="users" size={16} />
                                共 {students.length} 名學生
                            </span>

                            <div className="flex flex-wrap items-center justify-end gap-2">
                                <button
                                    type="button"
                                    onClick={handleExportBackup}
                                    className="flex items-center gap-2 px-4 py-2.5 bg-sky-600 text-white rounded-xl hover:bg-sky-700 shadow-sm transition-all font-semibold"
                                >
                                    <Icon name="download" size={18} />
                                    匯出備份
                                </button>
                                <button
                                    type="button"
                                    onClick={() => backupFileInputRef.current?.click()}
                                    className="flex items-center gap-2 px-4 py-2.5 bg-white text-sky-700 border border-sky-200 rounded-xl hover:bg-sky-50 shadow-sm transition-all font-semibold"
                                >
                                    <Icon name="upload" size={18} />
                                    匯入備份
                                </button>
                                <input
                                    ref={backupFileInputRef}
                                    type="file"
                                    accept=".json,application/json"
                                    onChange={handleImportBackup}
                                    className="hidden"
                                />
                                <button
                                    type="button"
                                    onClick={handleExport}
                                    disabled={students.length === 0}
                                    className="flex items-center gap-2 px-6 py-3 bg-gray-800 text-white rounded-xl hover:bg-gray-900 shadow-lg hover:shadow-gray-300/50 transition-all font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    <Icon name="download" />
                                    匯出評語 (.txt)
                                </button>
                            </div>
                        </div>
                    </div>

                    <TraitsModal 
                        isOpen={modalConfig.isOpen}
                        onClose={() => setModalConfig({ isOpen: false, studentId: null })}
                        onAddTraits={handleAddTraitsFromModal}
                        presetTraits={presetTraits}
                        setPresetTraits={setPresetTraits}
                    />

                    <RosterImportModal
                        isOpen={isRosterImportOpen}
                        onClose={() => setIsRosterImportOpen(false)}
                        onImport={importRoster}
                    />

                    <PromptPreviewDialog
                        prompt={promptPreview?.prompt}
                        onClose={() => setPromptPreview(null)}
                        onConfirm={handleConfirmPrompt}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
