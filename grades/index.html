<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級成績計算器</title>
<style>
:root { font-family: system-ui, sans-serif; color: #213547; background: #f3f6fa; }
body { margin: 0; padding: 32px 24px 80px; }
header, main { max-width: 1100px; margin: auto; }
h1 { margin-bottom: 8px; }
p { color: #58677a; line-height: 1.6; }
main { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr); gap: 24px; align-items: start; }
section { background: white; border: 1px solid #dce3ed; border-radius: 16px; padding: 24px; }
.heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h2 { font-size: 1.2rem; }
button { cursor: pointer; background: #1c6258; color: white; border: 0; border-radius: 8px; padding: 10px 14px; font: inherit; }
button:disabled { opacity: .5; cursor: not-allowed; }
#clear { background: #edf2f6; color: #35465a; font-size: .85rem; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 10px; border-bottom: 1px solid #e5eaf0; }
th { color: #58677a; font-weight: 500; }
input { box-sizing: border-box; width: 100%; font: inherit; padding: 9px; border: 1px solid #c7d1de; border-radius: 6px; }
input:focus { outline: 2px solid #287e70; outline-offset: 1px; }
input[aria-invalid="true"] { color: #bc2635; border-color: #bc2635; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.stat { padding: 16px 8px; background: #f0f7f5; border-radius: 8px; text-align: center; }
.stat strong { display: block; margin-top: 8px; font-size: 1.5rem; }
#message { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(90%, 700px); box-sizing: border-box; padding: 16px; background: #912d39; color: white; border-radius: 10px; box-shadow: 0 4px 20px #0002; }
#message[hidden] { display: none; }
@media (max-width: 700px) { body { padding: 16px 12px 90px; } main { grid-template-columns: 1fr; } section { padding: 16px; } }
</style>
</head>
<body>
<header><h1>班級成績計算</h1><p>輸入或貼上成績，即時掌握全班表現。資料會自動儲存在此瀏覽器。</p></header>
<main>
<section aria-labelledby="input-title">
<label for="class-subject">班級科目</label>
<input id="class-subject" type="text" placeholder="四年一班數學">
<div class="heading"><h2 id="input-title">學生成績</h2><button id="clear" type="button">清除全部</button></div>
<p id="hint">每行一位學生，空白表示無學生。Enter、↑、↓ 可切換座號；輸入 20～100 分自動移至下一列。</p>
<p><label><input id="auto-next" type="checkbox" checked style="width:auto"> 輸入 20～100 分自動跳列</label>（輸入小數時可關閉）</p>
<table><thead><tr><th scope="col">座號</th><th scope="col">成績</th></tr></thead><tbody id="inputs"></tbody></table>
</section>
<section aria-labelledby="result-title">
<div class="heading"><h2 id="result-title">計算結果</h2><button id="export" type="button">輸出計算結果</button></div>
<p id="count" aria-live="polite"></p>
<div class="stats"><div class="stat">總平均<strong id="mean">--</strong></div><div class="stat">標準差<strong id="deviation">--</strong></div><div class="stat">中位數<strong id="median">--</strong></div></div>
<p>標準差採母體標準差，統計數值顯示至小數點後兩位。</p>
<h2>分數級距</h2><table><thead><tr><th>級距</th><th>人數</th></tr></thead><tbody id="bands"></tbody></table>
<h2>成績排序</h2><p>依成績由高至低排列，同分依座號排列。</p>
<table><thead><tr><th>座號</th><th>成績</th></tr></thead><tbody id="ranking"></tbody></table>
</section>
</main>
<div id="message" role="alert" hidden></div>
<script>
'use strict';
const STORAGE_PREFIX_KEY = 'mentor_grades';
const BAND_LABELS = ['100 分以上', '99～90', '89～80', '79～70', '69～60', '60 以下'];
function parseScore(value) {
    const text = String(value).trim();
    if (!text) return null;
    const score = Number(text);
    return /^\d*(?:\.\d*)?$/.test(text) && Number.isFinite(score) && score >= 0 ? score : NaN;
}
function calculate(values) {
    const students = [];
    const invalid = [];
    values.forEach((value, index) => {
        const score = parseScore(value);
        if (Number.isNaN(score)) invalid.push(index + 1);
        else if (score !== null) students.push({ seat: index + 1, score });
    });
    if (invalid.length) return { invalid, students: [], bands: Array(6).fill(0) };
    const bands = Array(6).fill(0);
    students.forEach(({ score }) => bands[score >= 100 ? 0 : score >= 90 ? 1 : score >= 80 ? 2 : score >= 70 ? 3 : score >= 60 ? 4 : 5]++);
    const sorted = [...students].sort((a, b) => b.score - a.score || a.seat - b.seat);
    const count = students.length;
    const mean = count ? students.reduce((sum, s) => sum + s.score / count, 0) : null;
    const deviation = count ? Math.hypot(...students.map(s => (s.score - mean) / Math.sqrt(count))) : null;
    const middle = Math.floor(count / 2);
    const median = count ? (count % 2 ? sorted[middle].score : sorted[middle - 1].score / 2 + sorted[middle].score / 2) : null;
    return { invalid, students: sorted, bands, mean, deviation, median };
}
function format(value) { return value == null ? '--' : value.toFixed(2); }
function exportText(values, title = '') {
    const result = calculate(values);
    if (result.invalid.length) throw new Error('Invalid scores');
    let last = values.length - 1;
    while (last >= 0 && parseScore(values[last]) === null) last--;
    const scores = values.slice(0, last + 1).map((value, i) => `${String(i + 1).padStart(2, '0')}. ${parseScore(value) ?? '--'}`);
    return [`# ${title.trim() || '班級成績表'}`, '', '## 計算結果', '', `學生人數：${result.students.length}`, `總平均：${format(result.mean)}`, `標準差（母體）：${format(result.deviation)}`, `中位數：${format(result.median)}`, '', ...BAND_LABELS.map((label, i) => `${label}：${result.bands[i]} 人`), '', '### 成績排序', '', ...result.students.map(s => `${String(s.seat).padStart(2, '0')} 號：${s.score}`), '', '## 學生成績', '', ...scores, ''].join('\n');
}
function timestamp(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
}
function pasteValues(values, start, text) {
    const next = [...values];
    text.replace(/\r\n?/g, '\n').split('\n').slice(0, values.length - start).forEach((value, i) => { next[start + i] = value.trim(); });
    return next;
}
function initialize() {
    const $ = id => document.getElementById(id);
    let storageWarning = '';
    let saved = [];
    try {
        const data = JSON.parse(localStorage.getItem(`${STORAGE_PREFIX_KEY}_scores`) || '[]');
        if (Array.isArray(data)) saved = data;
        $('class-subject').value = localStorage.getItem(`${STORAGE_PREFIX_KEY}_class_subject`) || '';
    } catch { storageWarning = '無法讀取儲存資料，請確認瀏覽器儲存設定。'; }
    const inputs = Array.from({ length: 100 }, (_, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `<th scope="row">${String(i + 1).padStart(2, '0')}</th><td><input type="text" inputmode="decimal" aria-label="座號 ${i + 1} 成績" aria-describedby="hint" autocomplete="off"></td>`;
        $('inputs').append(row);
        const input = row.querySelector('input');
        input.value = typeof saved[i] === 'string' || typeof saved[i] === 'number' ? saved[i] : '';
        return input;
    });
    const values = () => inputs.map(input => input.value);
    const focus = i => inputs[Math.max(0, Math.min(99, i))].focus();
    function update() {
        const raw = values();
        const result = calculate(raw);
        inputs.forEach((input, i) => input.setAttribute('aria-invalid', String(result.invalid.includes(i + 1))));
        try {
            localStorage.setItem(`${STORAGE_PREFIX_KEY}_scores`, JSON.stringify(raw));
            localStorage.setItem(`${STORAGE_PREFIX_KEY}_class_subject`, $('class-subject').value);
            storageWarning = '';
        }
        catch { storageWarning = '無法儲存資料，請在離開前匯出計算結果。'; }
        const invalid = result.invalid.length > 0;
        const message = invalid ? `座號 ${result.invalid.join('、')} 的成績無效。請輸入零或正數，負分數無法計算。` : storageWarning;
        $('message').textContent = message;
        $('message').hidden = !message;
        $('count').textContent = invalid ? '請修正成績後再計算。' : `已輸入 ${result.students.length} 位學生`;
        ['mean', 'deviation', 'median'].forEach(key => { $(key).textContent = format(result[key]); });
        $('bands').innerHTML = BAND_LABELS.map((label, i) => `<tr><td>${label}</td><td>${invalid ? '--' : result.bands[i]}</td></tr>`).join('');
        $('ranking').innerHTML = result.students.map(s => `<tr><td>${String(s.seat).padStart(2, '0')}</td><td>${s.score}</td></tr>`).join('');
        $('export').disabled = invalid;
    }
    inputs.forEach((input, i) => {
        input.addEventListener('focus', () => input.select());
        input.addEventListener('input', event => {
            update();
            const score = parseScore(input.value);
            if ($('auto-next').checked && !event.isComposing && score >= 20 && score <= 100) focus(i + 1);
        });
        input.addEventListener('keydown', event => {
            if (event.isComposing) return;
            const down = event.key === 'Enter' || event.key === 'ArrowDown';
            const up = event.key === 'ArrowUp' || (['Backspace', 'Delete'].includes(event.key) && !input.value);
            if (down || up) { event.preventDefault(); focus(i + (down ? 1 : -1)); }
        });
        input.addEventListener('paste', event => {
            const text = event.clipboardData.getData('text');
            if (!/[\r\n]/.test(text)) return;
            event.preventDefault();
            pasteValues(values(), i, text).forEach((value, j) => { inputs[j].value = value; });
            update();
        });
    });
    $('class-subject').addEventListener('input', update);
    $('clear').addEventListener('click', () => { inputs.forEach(input => { input.value = ''; }); update(); focus(0); });
    $('export').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([exportText(values(), $('class-subject').value)], { type: 'text/plain;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = `${timestamp(new Date())}.txt`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    update();
}
if (typeof document !== 'undefined') initialize();
</script>
</body>
</html>
